services:
  kibble:
    # python:3.12-alpine (pinned) + the Anthropic SDK, built from app/Dockerfile
    # with hash-pinned wheels (app/requirements.txt)
    build: ./app
    image: kibble:local
    container_name: kibble
    command: python -u /app/server.py
    user: '1026:100'
    working_dir: /app
    environment:
      - TZ=Europe/Amsterdam
      - SYNC_TOKEN=${SYNC_TOKEN:?set SYNC_TOKEN in .env}
      # Optional: without it, definitions come from Wiktionary only
      - MW_KEY=${MW_KEY:-}
      # Optional: without it, the AI explanations are off
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Exact host names the app answers to (DNS-rebinding guard), from .env
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - /volume1/docker/kibble/app:/app:ro
      - /volume1/docker/kibble/data:/data
    # All interfaces: binding to the Tailscale IP fails if Tailscale is not up
    # when Docker starts after a reboot. The NAS has only LAN and Tailscale.
    ports:
      - '8770:8770'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    restart: always

  # Serves Kibble over HTTPS on the tailnet only (no Funnel), for the iPhone
  # app. A Tailscale node of its own with a neutral name, so only
  # "kibble.your-tailnet.ts.net" appears in public certificate logs, not the
  # NAS's names. Userspace networking: no TUN device, no capabilities, and no
  # clash with the NAS's own Tailscale gateway.
  kibble-ts:
    # tailscale/tailscale:stable, pinned (same image as the NAS gateway)
    image: tailscale/tailscale@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: kibble-ts
    hostname: ${TS_HOSTNAME:-kibble}
    environment:
      - TS_HOSTNAME=${TS_HOSTNAME:-kibble}
      # Only needed for the first login (a single-use key for tag:kibble);
      # TS_AUTH_ONCE keeps the saved login, so remove the key afterwards.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - /volume1/docker/kibble/tailscale:/var/lib/tailscale
      - /volume1/docker/kibble/app/tailscale-serve.json:/config/serve.json:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: always
