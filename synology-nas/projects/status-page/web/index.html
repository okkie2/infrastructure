<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f4f2; --fg: #1d2326; --muted: #6b767c; --line: #dfe3e1; --hover: #e8ecea;
    --accent: #1f6f8b; --ok: #1d7a46; --warn: #a65f00; --stale: #7a8791;
    --icon-plex: #a96a00; --icon-jellyfin: #7451c8; --icon-immich: #c53a6a;
    --icon-calibre: #1c784c; --icon-lazylibrarian: #087e8b; --icon-qbittorrent: #64820e;
    --icon-arr: #b44b16; --icon-dsm: #365ea8; --icon-kindle: #a34e9e; --icon-tailscale: #007fbc;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14191c; --fg: #e6ecef; --muted: #8f9da6; --line: #2a343a; --hover: #1e272c;
      --accent: #6bc0dc; --ok: #5fcf8e; --warn: #f0b04f; --stale: #8c9ba5;
      --icon-plex: #f5bb45; --icon-jellyfin: #a889ff; --icon-immich: #ff78a1;
      --icon-calibre: #53c98b; --icon-lazylibrarian: #4cc6d3; --icon-qbittorrent: #b5d55a;
      --icon-arr: #ff925f; --icon-dsm: #82aaff; --icon-kindle: #e38dde; --icon-tailscale: #52c8ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 16px 48px; display: flex; flex-direction: column; gap: 36px; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0; }
  .mono { font-family: var(--mono); font-size: .82rem; }

  header { display: flex; flex-direction: column; gap: 10px; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; min-height: 1.4em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.warn { background: var(--warn); border-radius: 2px; transform: rotate(45deg); }
  .dot.stale { background: transparent; box-shadow: inset 0 0 0 1.5px var(--stale); }
  .status button { all: unset; cursor: pointer; color: var(--fg); border-bottom: 1px solid var(--line); }
  .status button:hover { border-color: var(--accent); }
  .status button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 28px; margin: 0; padding: 0; list-style: none; }
  .links a { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 8px; margin: 0 -8px; border-bottom: 1px solid var(--line); border-radius: 6px; }
  .links a:hover { background: var(--hover); }
  .links .n { font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .links .p { color: var(--muted); }
  .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ic--plex { stroke: var(--icon-plex); }
  .ic--jellyfin { stroke: var(--icon-jellyfin); }
  .ic--immich { stroke: var(--icon-immich); }
  .ic--calibre { stroke: var(--icon-calibre); }
  .ic--lazylibrarian { stroke: var(--icon-lazylibrarian); }
  .ic--qbittorrent { stroke: var(--icon-qbittorrent); }
  .ic--arr { stroke: var(--icon-arr); }
  .ic--dsm { stroke: var(--icon-dsm); }
  .ic--kindle { stroke: var(--icon-kindle); }
  .ic--tailscale { stroke: var(--icon-tailscale); }
  @media (max-width: 480px) { .links { grid-template-columns: 1fr; } }

  details { border-top: 1px solid var(--line); }
  summary { cursor: pointer; padding: 14px 0; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "Show"; }
  details[open] summary::after { content: "Hide"; }
  .detail { display: flex; flex-direction: column; gap: 20px; padding-bottom: 8px; }
  .detail h2 { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 0; }
  .kv dd { margin: 0; text-align: right; color: var(--muted); }
  .kv dd.warn { color: var(--warn); }
  .kv dd.stale { color: var(--stale); }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .stack span { white-space: nowrap; }
  .stack span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .stack span.stopped::before { background: var(--warn); border-radius: 0; }
  .stack span.unknown::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--stale); }
  footer { font-size: .75rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<script>
(function () {
  var STATUS_URL = 'status.json';
  var REFRESH_MS = 5 * 60 * 1000; // re-poll status.json every 5 min, no reload needed
  var statusLine = document.getElementById('status-line');
  var detailBody = document.getElementById('detail-body');
  var stamp = document.getElementById('stamp');
  var detailsEl = document.getElementById('details');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function fmtAge(days) {
    if (days === null || days === undefined) return 'unknown';
    if (days < 1) return Math.round(days * 24) + 'h ago';
    return days.toFixed(1) + 'd ago';
  }
  function fmtWhen(iso) {
    if (!iso) return 'never';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function cls(status) { return status === 'warn' ? 'warn' : (status === 'ok' ? '' : 'stale'); }

  function section(title) {
    var s = el('div');
    s.appendChild(el('h2', '', title));
    return s;
  }
  function kv(rows) {
    var dl = el('dl', 'kv');
    rows.forEach(function (r) {
      dl.appendChild(el('dt', '', r[0]));
      dl.appendChild(el('dd', r[2] || '', r[1]));
    });
    return dl;
  }

  function render(data) {
    var tm = data.time_machine || {};
    var lb = data.linkedin_backup || {};
    var hb = data.ok035_backup || {};
    var wt = data.watchtower || {};
    var sa = data.security_advisor || {};

    // Summary rows: [label, value text, status]
    var checks = [];
    checks.push(['Time Machine', tm.last_backup ? fmtWhen(tm.last_backup) + ' (' + fmtAge(tm.age_days) + ')' : 'unknown', tm.status]);
    checks.push(['LinkedIn backup', lb.last_backup ? fmtWhen(lb.last_backup) + ' (' + fmtAge(lb.age_days) + ')' : (lb.note || 'unknown'), lb.status]);
    Object.keys(hb.repos || {}).forEach(function (name) {
      var r = hb.repos[name];
      checks.push(['Backup to OK035, ' + name, fmtWhen(r.last_activity) + ' (' + fmtAge(r.age_days) + ')', hb.status]);
    });
    var wtText = wt.last_run ? fmtWhen(wt.last_run) + (wt.age_hours != null ? ' (' + wt.age_hours + 'h ago)' : '')
      : (wt.note || 'no last-check time');
    checks.push(['Watchtower last check', wtText, wt.status]);
    var saText = sa.last_scan ? fmtWhen(sa.last_scan) + ' (' + fmtAge(sa.age_days) + ')' +
      (sa.fail_count != null ? ', ' + sa.fail_count + ' failed, ' + sa.warning_count + ' warnings' : '') : 'unknown';
    checks.push(['Security Advisor scan', saText, sa.status]);

    var attention = checks.filter(function (c) { return c[2] !== 'ok'; });

    // Containers
    var collection = data.container_collection || { status: 'unavailable' };
    var containers = Array.isArray(data.containers) ? data.containers : [];
    var collOk = collection.status === 'available' || collection.status === 'partial';
    var running = containers.filter(function (c) { return c.runtime_state === 'running'; }).length;
    var stopped = containers.filter(function (c) { return c.runtime_state === 'stopped'; });
    var updates = containers.filter(function (c) { return c.update_available === true; });

    var problems = attention.length + stopped.length + updates.length + (collection.status === 'partial' ? 1 : 0);

    // Status line
    statusLine.textContent = '';
    var level = !collOk ? 'stale' : (stopped.length || problems ? 'warn' : '');
    statusLine.appendChild(el('span', 'dot ' + level));
    var msg = el('span');
    if (!collOk) {
      msg.textContent = 'Container status unavailable.';
    } else {
      msg.textContent = stopped.length
        ? running + ' of ' + containers.length + ' containers running. '
        : 'All ' + containers.length + ' containers running. ';
      if (problems) {
        var b = el('button', '', problems + (problems === 1 ? ' thing needs a look' : ' things need a look'));
        b.type = 'button';
        b.addEventListener('click', function () { detailsEl.open = true; detailsEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        msg.appendChild(b);
      } else {
        msg.appendChild(document.createTextNode('Nothing needs attention.'));
      }
    }
    statusLine.appendChild(msg);

    // Details
    detailBody.textContent = '';
    var needs = [];
    attention.forEach(function (c) { needs.push([c[0], c[1], cls(c[2])]); });
    stopped.forEach(function (c) { needs.push([c.name, 'stopped', 'warn']); });
    updates.forEach(function (c) { needs.push([c.name, 'update available', 'warn']); });
    if (collection.status === 'partial') needs.push(['Containers', 'some details could not be read', 'warn']);
    if (needs.length) {
      var s1 = section('Needs a look');
      s1.appendChild(kv(needs));
      detailBody.appendChild(s1);
    }
    var okChecks = checks.filter(function (c) { return c[2] === 'ok'; }).map(function (c) { return [c[0], c[1]]; });
    if (okChecks.length) {
      var s2 = section('Healthy');
      s2.appendChild(kv(okChecks));
      detailBody.appendChild(s2);
    }
    if (hb.note) detailBody.appendChild(el('p', 'note', 'Backup to OK035: ' + hb.note));
    if (collOk && containers.length) {
      var s3 = section('Containers');
      var stack = el('div', 'stack mono');
      containers.forEach(function (c) {
        var n = el('span', c.runtime_state === 'running' ? '' : (c.runtime_state === 'stopped' ? 'stopped' : 'unknown'),
          typeof c.name === 'string' ? c.name : 'unnamed');
        n.title = (c.runtime_label || 'Runtime state unknown') + (c.age_days != null ? ' · image ' + c.age_days.toFixed(1) + 'd old' : '');
        stack.appendChild(n);
      });
      s3.appendChild(stack);
      detailBody.appendChild(s3);
    }
    stamp.textContent = data.generated_at ? 'updated ' + fmtWhen(data.generated_at) : '';
  }

  function load() {
    fetch(STATUS_URL + '?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () {
        statusLine.textContent = '';
        statusLine.appendChild(el('span', 'dot stale'));
        statusLine.appendChild(el('span', '', 'No status data yet. Run gather-status.py once (see /volume1/docker/status-page).'));
      });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
