services:
  keeper:
    image: ghcr.io/okkie2/keeper@sha256:2f4715e3deba244a93ab40002df11c6f6a501d5682e78486ef9e05839c245433
    container_name: keeper
    user: "1029:100"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    ports:
      - "100.126.55.95:8766:8766"
    volumes:
      - type: bind
        source: /volume1/homes/joost/Notes
        target: /notes
        read_only: false
    environment:
      KEEPER_TOKEN: "${KEEPER_TOKEN:?missing}"
      KEEPER_GIT_NAME: Joost Okkinga
      KEEPER_GIT_EMAIL: joost@okkinga.com
      KEEPER_PUBLISH_HOST: 100.126.55.95
      KEEPER_ROOT: /notes
      KEEPER_HOST: 0.0.0.0
      KEEPER_PORT: "8766"
      HOME: /tmp
