# Gluetun (VPN) + qBittorrent. qBittorrent has no network of its own: it uses Gluetun's,
# so if the tunnel is down it has no route to the internet (kill switch).
# WIREGUARD_PRIVATE_KEY comes from the .env file next to this file (never committed).
services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN            # lets Gluetun manage the WireGuard interface and firewall
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # qBittorrent's ports are published here because it shares Gluetun's network.
      - "8080:8080"                # qBittorrent Web UI (LAN)
      # Control server, reachable from the NAS itself only (not the LAN).
      - "127.0.0.1:8000:8000"
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}   # IPv4 only
      - SERVER_COUNTRIES=Netherlands
      # AirVPN forwarded port (airvpn.org/ports, TCP+UDP, remote = local port). Must match
      # qBittorrent's listening port. Gluetun does not open AirVPN ports on its own.
      - FIREWALL_VPN_INPUT_PORTS=25518
      # Allow LAN traffic in and out of the tunnel container (Web UI). Not the internet.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.178.0/24
      - TZ=Europe/Amsterdam
    volumes:
      - /volume1/docker/gluetun:/gluetun

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"   # no network of its own: only Gluetun's tunnel
    depends_on:
      gluetun:
        condition: service_healthy    # start only once the VPN is up
        restart: true                 # re-attach if Gluetun is recreated or restarted
    environment:
      - PUID=1031                     # downloader
      - PGID=100                      # users
      - UMASK=002                     # new files 664 / dirs 775, so `users` (master, SMB) can edit them
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8080
    volumes:
      - /volume1/docker/qbittorrent/config:/config
      - /volume1/download/qbittorrent:/downloads

  # Indexer manager. Deliberately NOT behind the VPN: many indexers block VPN addresses.
  # It only talks to indexer websites and to qBittorrent's Web UI at gluetun:8080.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1031                     # downloader
      - PGID=100                      # users
      - UMASK=002
      - TZ=Europe/Amsterdam
    volumes:
      - /volume1/docker/prowlarr/config:/config
    ports:
      - "9696:9696"                   # Prowlarr Web UI

  # TV series manager. Not behind Gluetun; downloaded files still arrive via qBittorrent.
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1031                     # downloader
      - PGID=100                      # users
      - UMASK=002
      - TZ=Europe/Amsterdam
    volumes:
      - /volume1/docker/sonarr/config:/config
      - /volume1/download/qbittorrent:/downloads
      - /volume1/video/TV Shows:/tv
    ports:
      - "8989:8989"                   # Sonarr Web UI, same published-port pattern as existing apps

  # Book manager (Readarr is retired). Not behind Gluetun. Imports finished books into the
  # existing Calibre library with calibredb, which Calibre-Web serves from the same folder.
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    restart: unless-stopped
    environment:
      - PUID=1028                     # calibre: the only account with write access to the Calibre library ACL
      - PGID=100                      # users
      - UMASK=002
      - TZ=Europe/Amsterdam
      - DOCKER_MODS=linuxserver/mods:universal-calibre   # provides /usr/bin/calibredb
    volumes:
      - /volume1/docker/lazylibrarian/config:/config
      - /volume1/download/qbittorrent:/downloads
      - /volume1/books:/books         # Calibre library is /books/Library
    ports:
      - "5299:5299"                   # LazyLibrarian Web UI, same published-port pattern as existing apps
    healthcheck:
      # Any HTTP answer counts (the login returns 401); only a dead or hung web server fails.
      test: ["CMD-SHELL", "curl -s -o /dev/null -m 5 http://localhost:5299/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s              # the universal-calibre mod reinstalls its packages on every (re)create, ~5-8 min
