- name: Add Docker's apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable\n"
    mode: "0644"
  register: docker_repo

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: "{{ docker_repo.changed }}"

# Written before first start where possible; a later change restarts dockerd and its containers.
- name: Configure Docker log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'log-driver': 'local', 'log-opts': {'max-size': docker_log_max_size, 'max-file': docker_log_max_file}, 'live-restore': true} | to_nice_json }}\n"
    mode: "0644"
  notify: Restart docker

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
# The administrator is deliberately not in the docker group (root-equivalent); use sudo docker.
